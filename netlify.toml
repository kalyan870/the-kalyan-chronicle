[build]
  command = "bun run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["firebase-applet-config.json", "db/migrations/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
